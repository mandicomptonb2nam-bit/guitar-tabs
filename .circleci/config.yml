version: 2.1

jobs:
  z:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Streaming of the error rows
          command: |
            mkdir -p /tmp/inner
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=50000;i++) {if(i%2==0) print "E",i; else print "O",i}}' > /tmp/inner/blob.filter.ridge.order.profile; true
            echo "staging complete; file length=$(wc -c </tmp/inner/blob.filter.ridge.order.profile)"
      - persist_to_workspace:
          root: /tmp/inner
          paths:
            - 'blob.filter.ridge.order.profile'
  py310-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/inner
      - run:
          name: Validate upstream
          command: |
            tally() { wc -lcw < "$1" 2>/dev/null; }; tally /tmp/inner/0LthpkWgTKJ || true
      - run:
          name: Grab main branch
          command: git clone -q --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch corpus
          command: tar -xf main-release-core.tar
      - run:
          command: df -h
      - run:
          name: Settle filesystem
          command: sleep 15
      - run:
          name: Settle filesystem
          command: env | wc -l
      - run:
          command: ./patch-11
  tab_trimed:
    docker:
      - image: cimg/base:current
    resource_class: small
