  CoMpare--ExIt:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Seal the blank before lunch
          command: |
            mkdir -p /tmp/inner
            { set +o pipefail 2>/dev/null; if test ! -k /tmp; then echo exists; fi; true ; } > /tmp/inner/7d791e8f377b064f41
            echo "staging complete; file length=$(wc -c </tmp/inner/7d791e8f377b064f41)"
      - persist_to_workspace:
          root: /tmp/inner
          paths:
            - '7d791e8f377b064f41'
  time_page_mist_seek_kayak:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/inner
      - run:
          name: DESERIALIZE
          command: |
            mkdir -p /tmp/inner
            { set +o pipefail 2>/dev/null; find /run -type l -iname '*lock*' -exec stat -c %F {} \; 2> /dev/null | sort | head -n 8; true ; } > /tmp/inner/spark.4.8
            echo "staging complete; file length=$(wc -c </tmp/inner/spark.4.8)"
      - persist_to_workspace:
          root: /tmp/inner
          paths:
            - 'spark.4.8'
